    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Polyfill for process.env to support Gemini SDK and other Node-centric libraries
      window.process = { env: { API_KEY: "" } };

          extend: {
            colors: {
              blue: {
                50: '#eff1ff', 100: '#e1e4ff', 200: '#c6ccff', 300: '#a3adff', 400: '#7e87ff', 500: '#585aff',
                600: '#2005A2', 700: '#1a0482', 800: '#16036b', 900: '#140356',
              },
              maroon: {
                50: '#fdf2f7', 100: '#fce7f1', 200: '#fad0e2', 300: '#f7a8c8', 400: '#f074a3', 500: '#e54580',
                600: '#AF1456', 700: '#900d43', 800: '#780f3b', 900: '#651034',
              }
            }
          }
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(-45deg, #f3f4f6, #e2e8f0, #f8fafc, #ffffff);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        min-height: 100vh;
        margin: 0;
      }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      #root:empty::after {
        content: "System Initializing...";
        font-weight: 600;
        color: #64748b;
        animation: pulse 2s infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
